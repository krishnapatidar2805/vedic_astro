{% extends 'base.html' %}
{% block title %}Login | {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="form-card">
          <div class="text-center mb-4">
            <span class="brand-icon" style="color:var(--gold);font-size:2rem;">ॐ</span>
            <h3 class="section-title mt-2">Welcome <span>Back</span></h3>
            <p class="text-muted">Login to manage your appointments and profile.</p>
          </div>
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Username</label>
              {{ form.username }}
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              {{ form.password }}
            </div>
            <button type="submit" class="btn btn-gold btn-lg w-100 mt-2">Login</button>
          </form>
          <p class="text-center text-muted mt-4">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-gold fw-bold">Register here</a></p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
